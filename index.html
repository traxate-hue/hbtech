<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

  <div class="container">
    <div class="lado tendenze" onclick="entrar('tendenze')">
      <div class="lado-conteudo">
        <p class="lado-subtitulo">Prata</p>
        <h1>TENDENZE</h1>

        <div class="lado-info">
          <p>Prata 925 e 700</p>
          <p>Mínimo de 6 peças por referência</p>
          <p>Pedido via representante</p>
        </div>

        <button class="botao-home">Entrar</button>
      </div>
    </div>

    <div class="lado zarrara" onclick="entrar('zarrara')">
      <div class="lado-conteudo">
        <p class="lado-subtitulo">Folheados</p>
        <h1>ZARRARA</h1>

        <div class="lado-info">
          <p>Banhado em ouro</p>
          <p>Mínimo de 10 peças por referência</p>
          <p>Pedido via representante</p>
        </div>

        <button class="botao-home">Entrar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
